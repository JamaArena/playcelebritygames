name: Game checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test
      - run: node --check server.mjs
      - run: node --check game.mjs
      - run: node --check public/app.js
      - run: node --check public/world.js
